name: Pre-approve
on: deployment_status

permissions:
  actions: read
  deployments: write

jobs:
  approve:
    runs-on: ubuntu-latest
    if: >-
      github.event.deployment_status.state == 'waiting' &&
      github.event.deployment.environment == 'Test' &&
      github.event.workflow_run.name == 'Privileged Verify' &&
      (github.actor == 'dependabot[bot]' || github.actor == github.repository_owner)
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Get environment id
        id: env-id
        run: echo "env-id=$(gh api repos/${{ github.repository }}/environments/Test --jq .id)" >> $GITHUB_OUTPUT
      - name: Approve
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          ENV_ID: ${{ steps.env-id.outputs.env-id }}
        run: |-
          gh api --method POST \
            repos/${{ github.repository }}/actions/runs/${RUN_ID}/pending_deployments \
            --input '{"environment_ids": [${ENV_ID}], "state": "approved", "comment": "Auto-approved trusted actor by workflow"}'
